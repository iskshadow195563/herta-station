name: build

# Builds installable artifacts for every supported platform:
#   Windows -> HertaStation-Setup-<v>.exe (installer, llama.cpp inside)
#   Linux   -> herta-station_<v>_amd64.deb
#   macOS   -> HertaStation-<v>-macos-{arm64,x64}.zip (+ .dmg on the arm64 job)
# Nothing is published automatically: artifacts stay attached to the run, and a
# tagged release only uploads them when you create the release yourself.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  LLAMA_TAG: b11934

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Unit tests (hostos + regression suite)
        run: python tests/smoke.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Build the Rust downloader
        run: cargo build --release --manifest-path tools/herta-rs/Cargo.toml
      - name: Fetch llama.cpp binaries
        run: python tools/fetch-llama.py --platform win --tag $env:LLAMA_TAG
      - name: Build portable exe, installer payload and setup exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name HertaStation --icon herta.ico --add-data "ui.html;." --paths . --collect-all webview --collect-all clr_loader --distpath dist herta_app.py
          python tools/make_dist.py --platform win
      - uses: actions/upload-artifact@v4
        with:
          name: HertaStation-windows-x64
          path: |
            dist/HertaStation.exe
            dist/HertaStation-Setup-*.exe

  linux:
    # 22.04 keeps the glibc floor low enough for most current distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries for the Qt backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libasound2 libxkbfile1 dpkg
      - name: Build the Rust downloader
        run: |
          cargo build --release --manifest-path tools/herta-rs/Cargo.toml
          mkdir -p vendor/herta-rs/linux-x86_64
          cp tools/herta-rs/target/release/herta-rs vendor/herta-rs/linux-x86_64/
      - name: Fetch llama.cpp binaries
        run: python tools/fetch-llama.py --platform linux --tag "${LLAMA_TAG}"
      - name: Build the .deb
        run: python tools/make_dist.py --platform linux
      - name: Install and smoke-test the .deb
        run: |
          sudo dpkg -i dist/herta-station_*_amd64.deb
          herta-station --check
          /opt/herta-station/bin/herta-rs --version
      - uses: actions/upload-artifact@v4
        with:
          name: HertaStation-linux-amd64
          path: dist/herta-station_*_amd64.deb

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Rust downloader
        run: |
          cargo build --release --manifest-path tools/herta-rs/Cargo.toml
          mkdir -p vendor/herta-rs/macos-arm64
          cp tools/herta-rs/target/release/herta-rs vendor/herta-rs/macos-arm64/
      - name: Fetch llama.cpp binaries
        run: python tools/fetch-llama.py --platform macos-arm64 --tag "${LLAMA_TAG}"
      - name: Tests
        run: python tests/smoke.py
      - name: Build the app bundle and zip
        run: python tools/make_dist.py --platform macos-arm64
      - name: DMG
        run: ./packaging/make-macos-dmg.sh dist/HertaStation.app dist
      - uses: actions/upload-artifact@v4
        with:
          name: HertaStation-macos-arm64
          path: |
            dist/HertaStation-*-macos-arm64.zip
            dist/*.dmg

  macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Rust downloader
        run: |
          cargo build --release --manifest-path tools/herta-rs/Cargo.toml
          mkdir -p vendor/herta-rs/macos-x86_64
          cp tools/herta-rs/target/release/herta-rs vendor/herta-rs/macos-x86_64/
      - name: Fetch llama.cpp binaries
        run: python tools/fetch-llama.py --platform macos-x64 --tag "${LLAMA_TAG}"
      - name: Build the app bundle and zip
        run: python tools/make_dist.py --platform macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: HertaStation-macos-x64
          path: dist/HertaStation-*-macos-x64.zip
