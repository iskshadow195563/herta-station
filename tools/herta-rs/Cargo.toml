[package]
name = "herta-rs"
version = "0.1.0"
edition = "2021"
description = "Fast multi-connection GGUF downloader for Herta Station"
license = "MIT"

[[bin]]
name = "herta-rs"
path = "src/main.rs"

[dependencies]
ureq = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
